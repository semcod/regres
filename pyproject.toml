[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regres"
version = "0.1.58"
description = "Regression/import diagnostics helpers with TOON reports"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Tom Sapletta", email = "tom@sapletta.com"},
]
dependencies = []

license = "Apache-2.0"
[project.scripts]
regres = "regres.regres_cli:main"
import-error-toon-report = "regres.import_error_toon_report:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["regres*"]

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
